name: CI Pipeline

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  core-go-ci:
    name: Core Go Service (Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-go

    # The audit-writer and user-store integration tests need a real PostgreSQL:
    # they assert on trigger behaviour and SQL that no mock can reproduce.
    # TEST_DATABASE_URL is what switches them on; without it they skip, which is
    # why the variable must be set on the test step below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hims_test
          POSTGRES_USER: hims_app
          POSTGRES_PASSWORD: hims_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hims_app -d hims_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than pinning here, so the toolchain cannot
          # drift behind the module again (it previously pinned 1.22 against a
          # go.mod requiring 1.25, which does not build).
          go-version-file: services/core-go/go.mod
          cache-dependency-path: services/core-go/go.sum

      - name: Verify Go dependencies
        run: go mod verify

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        env:
          TEST_DATABASE_URL: postgres://hims_app:hims_test_password@localhost:5432/hims_test?sslmode=disable
        run: go test -v -race ./...

  interop-py-ci:
    name: Python Interop Service (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/interop-py

    # tests/test_cross_service.py builds and runs the real core-go service and
    # points a real CoreServiceClient at it, so this job needs both a database
    # and the Go toolchain. AGENTS.md requires that boundary be proven against
    # the running service, not a stub.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hims_test
          POSTGRES_USER: hims_app
          POSTGRES_PASSWORD: hims_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hims_app -d hims_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/core-go/go.mod
          cache-dependency-path: services/core-go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/interop-py/requirements.txt
            services/interop-py/requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and Bytecode compilation check
        run: python -m py_compile $(git ls-files '*.py')

      - name: Run Pytest
        env:
          TEST_DATABASE_URL: postgres://hims_app:hims_test_password@localhost:5432/hims_test?sslmode=disable
        run: python -m pytest -v

  frontend-ci:
    name: Frontend (Type-Check & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend regression tests
        run: npm test

      - name: TypeScript Check & Vite Build
        run: npm run build
