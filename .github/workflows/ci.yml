name: CI Pipeline

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  core-go-ci:
    name: Core Go Service (Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/core-go/go.sum

      - name: Verify Go dependencies
        run: go mod verify

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        run: go test -v -race ./...

  interop-py-ci:
    name: Python Interop Service (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/interop-py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and Bytecode compilation check
        run: python -m py_compile $(git ls-files '*.py')

      - name: Run Pytest
        run: python -m pytest -v

  frontend-ci:
    name: Frontend (Type-Check & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript Check & Vite Build
        run: npm run build
