services:
  postgres:
    image: postgres:16-alpine
    container_name: hims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hims}
      POSTGRES_USER: ${POSTGRES_USER:-hims_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hims_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hims_app} -d ${POSTGRES_DB:-hims}"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-go:
    build:
      context: ./services/core-go
      dockerfile: Dockerfile
    container_name: hims-core-go
    restart: unless-stopped
    ports:
      - "${CORE_GO_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-hims_app}:${POSTGRES_PASSWORD:-hims_dev_password}@postgres:5432/${POSTGRES_DB:-hims}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env - generate one with `openssl rand -base64 48`}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set in .env - generate one with `openssl rand -base64 32`}
    depends_on:
      postgres:
        condition: service_healthy

  interop-py:
    build:
      context: ./services/interop-py
      dockerfile: Dockerfile
    container_name: hims-interop-py
    restart: unless-stopped
    ports:
      - "${INTEROP_PY_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-hims_app}:${POSTGRES_PASSWORD:-hims_dev_password}@postgres:5432/${POSTGRES_DB:-hims}"
      CORE_SERVICE_URL: "http://core-go:8080"
      # Browser origins allowed to call this service directly. Never "*":
      # the service answers with credentials. Set the real origins for any
      # deployment; this default only fits local development.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set in .env - generate one with `openssl rand -base64 32`}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env - generate one with `openssl rand -base64 48`}
    depends_on:
      - core-go

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hims-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      CORE_API_URL: "http://core-go:8080"
      INTEROP_API_URL: "http://interop-py:8000"
      VITE_DEMO_MODE: "${VITE_DEMO_MODE:-false}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - core-go
      - interop-py

volumes:
  pgdata:
    driver: local
